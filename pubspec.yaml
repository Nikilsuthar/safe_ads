name: safe_ads
description: >-
  Safe AdMob ads for Flutter: banner, native, interstitial, rewarded and
  app-open with consent, capped retries, request limits and banner reuse.
version: 0.1.0
repository: https://github.com/Nikilsuthar/safe_ads
issue_tracker: https://github.com/Nikilsuthar/safe_ads/issues
topics:
  - admob
  - ads
  - monetization
  - google-mobile-ads
  - consent

environment:
  sdk: ^3.6.1
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: '>=5.3.1 <7.0.0'
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
